[remote.github]
owner = "golovanevvs"
repo = "magpie_nest"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
See [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and [SemVer](https://semver.org/).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (BREAKING){% endif %}{% if commit.links %} ([{{ commit.id }}]({{ commit.links.0.href }})){% endif %}
{% endfor %}
{% endfor %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
template = """
{% for release in releases %}\
{{ release.body | indent }}
{% endfor %}\
"""
postprocessors = [
  { pattern = '\\(?\\bBREAKING CHANGE\\b\\)?', replace = "BREAKING CHANGE" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(([^)]*)\\):?\\s*$", skip = true },
  { message = "^chore", group = "Misc" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^revert", group = "Revert" },
]
protect_breaking_commits = true
filter_commits = true