name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          REPO=orhun/git-cliff
          URL=$(curl -fsSL "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu\\.tar\\.gz$")) | .browser_download_url' | head -n1)
          curl -fsSL "$URL" -o /tmp/git-cliff.tgz
          tar -xzf /tmp/git-cliff.tgz -C /tmp
          CLIFF_BIN=$(find /tmp -type f -name 'git-cliff' | head -n1)
          sudo mv "$CLIFF_BIN" /usr/local/bin/git-cliff
      - name: Generate CHANGELOG.md
        run: git cliff -o CHANGELOG.md
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG"
          file_pattern: CHANGELOG.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"