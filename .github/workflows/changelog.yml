name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          REPO=orhunp/git-cliff
          V=$(curl -fsSL "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)
          curl -fsSL "https://github.com/$REPO/releases/download/$V/git-cliff-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tgz
          tar -xzf /tmp/git-cliff.tgz -C /tmp
          sudo mv /tmp/git-cliff/git-cliff /usr/local/bin/git-cliff
      - name: Generate CHANGELOG.md
        run: git cliff -o CHANGELOG.md
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG"
          file_pattern: CHANGELOG.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"