name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0-1.0.pre-119"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: magpie_nest-windows-x64.zip
          - os: ubuntu-latest
            target: linux
            artifact: magpie_nest-linux-x64.tar.gz
          - os: macos-latest
            target: macos
            artifact: magpie_nest-macos.zip
          - os: ubuntu-latest
            target: android
            artifact: magpie_nest-android.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Build
        shell: bash
        run: >-
          flutter build ${{ matrix.target == 'android' && 'apk' || matrix.target }}
          --release
          --build-name=${GITHUB_REF_NAME#v}
          --build-number=${{ github.run_number }}

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath artifacts/${{ matrix.artifact }}

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          mkdir -p artifacts
          tar -czf artifacts/${{ matrix.artifact }} -C build/linux/x64/release bundle

      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent build/macos/Build/Products/Release/magpie_nest.app artifacts/${{ matrix.artifact }}

      - name: Package Android
        if: matrix.target == 'android'
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Install git-cliff
        run: |
          REPO=orhunp/git-cliff
          V=$(curl -fsSL "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)
          curl -fsSL "https://github.com/$REPO/releases/download/$V/git-cliff-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tgz
          tar -xzf /tmp/git-cliff.tgz -C /tmp
          sudo mv /tmp/git-cliff/git-cliff /usr/local/bin/git-cliff
      - name: Generate release notes
        run: git cliff -o CHANGELOG.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: CHANGELOG.md
